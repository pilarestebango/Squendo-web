<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Join a Squendo game</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100svh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      background: #0D0C0C;
      color: #F5F3F0;
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    .card {
      width: 100%; max-width: 380px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 40px 28px;
      backdrop-filter: blur(20px);
    }
    .mark { display: flex; justify-content: center; margin-bottom: 22px; opacity: 0.95; }
    .mark svg { width: 150px; height: auto; display: block; }
    h1 { font-size: 22px; font-weight: 700; line-height: 1.3; margin-bottom: 8px; }
    p { font-size: 15px; line-height: 1.5; opacity: 0.7; margin-bottom: 24px; }
    .code-label { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.5; margin-bottom: 6px; }
    .code {
      font-size: 32px; font-weight: 800; letter-spacing: 6px;
      padding: 14px 0; margin-bottom: 28px;
      background: rgba(255,255,255,0.06); border-radius: 16px;
    }
    .code[hidden] { display: none; }
    a.btn {
      display: block; text-decoration: none;
      background: #F5F3F0; color: #0D0C0C;
      font-weight: 700; font-size: 16px;
      padding: 16px; border-radius: 16px;
      transition: transform 0.15s ease;
    }
    a.btn:active { transform: scale(0.97); }
    .hint { margin-top: 16px; font-size: 13px; opacity: 0.45; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-label="Squendo">

    </div>
    <h1>You've been invited to Squendo!</h1>
    <p>Get the app to jump into the game.</p>
    <div class="code-label" id="codeLabel" hidden>Your game code</div>
    <div class="code" id="code" hidden></div>
    <a class="btn" id="store" href="https://apps.apple.com/app/id6785156887">Get Squendo</a>
    <p class="hint">Already have the app? Open it and enter the code above.</p>
  </main>

  <script>
    (function () {
      var STORE_URL = "https://apps.apple.com/app/id6785156887";
      // Path looks like /join/ABCD — pull out the code segment.
      var parts = location.pathname.split("/").filter(Boolean);
      var i = parts.map(function (s) { return s.toLowerCase(); }).indexOf("join");
      var code = (i >= 0 && parts[i + 1]) ? decodeURIComponent(parts[i + 1]).toUpperCase() : null;

      if (code) {
        var el = document.getElementById("code");
        el.textContent = code;
        el.hidden = false;
        document.getElementById("codeLabel").hidden = false;
        // Remember it so a returning visitor still sees the code (best-effort).
        try { localStorage.setItem("squendo.invite", code); } catch (e) {}
      }

      if (i >= 0) {
        // Try to hand off to the installed app via its custom scheme first.
        // If Squendo is installed it takes over here (parsing squendo://join/<code>
        // straight into the lobby); the browser tab is backgrounded, which we detect
        // below to cancel the store redirect. If it's NOT installed nothing happens
        // and we fall through to the App Store.
        var appLink = code
          ? "squendo://join/" + encodeURIComponent(code)
          : "squendo://";
        var handedOff = false;
        var markHandedOff = function () { handedOff = true; };
        // The app opening hides/blurs this page — that's our "it worked" signal.
        document.addEventListener("visibilitychange", function () {
          if (document.hidden) markHandedOff();
        });
        window.addEventListener("pagehide", markHandedOff);
        window.addEventListener("blur", markHandedOff);

        // Give listeners a tick to attach, then attempt the app.
        setTimeout(function () { window.location.href = appLink; }, 50);

        // If the app never took over, send them to the App Store.
        setTimeout(function () {
          if (!handedOff && !document.hidden) location.replace(STORE_URL);
        }, 1500);
      }
    })();
  </script>
</body>
</html>
